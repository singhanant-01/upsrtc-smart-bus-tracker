plugins {
    alias(libs.plugins.android.application)

    id 'com.google.gms.google-services'
}

android {
    namespace 'com.anant.upsrtcsmartbustracker'
    def localProperties = new Properties()
    localProperties.load(rootProject.file("local.properties").newDataInputStream())

    def placesApiKey = localProperties.getProperty("PLACES_API_KEY")
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }
    buildFeatures {
            buildConfig true

    }

    defaultConfig {
        applicationId "com.anant.upsrtcsmartbustracker"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "PLACES_API_KEY", "\"${placesApiKey}\""
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
    implementation("com.google.android.gms:play-services-location:21.3.0")
    implementation platform('com.google.firebase:firebase-bom:35.2.0')
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.android.libraries.places:places:6.1.0'
    implementation "androidx.core:core:1.13.1"

}